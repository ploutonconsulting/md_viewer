name: Release

# Builds, signs, notarizes and publishes a release.
#
# Required repository secrets — the workflow fails fast if any are missing,
# so it can never publish an unsigned artifact:
#   MACOS_CERT_P12_BASE64  base64 of the "Developer ID Application" .p12 export
#   MACOS_CERT_PASSWORD    password used when exporting that .p12
#   ASC_KEY_ID             App Store Connect API key ID
#   ASC_ISSUER_ID          App Store Connect issuer ID
#   ASC_KEY_P8_BASE64      base64 of the AuthKey_<KEY_ID>.p8 file

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v, e.g. 0.2.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      SCHEME: MDViewer
      CONFIGURATION: Release
      APP_NAME: MDViewer
      TEAM_ID: 7X2XV24BPN
    steps:
      - uses: actions/checkout@v5

      - name: Require signing credentials
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Refuse to run at all rather than fall back to an ad-hoc signature.
          # A release that looks published but is rejected by Gatekeeper is
          # worse than no release: GitHub releases are immutable here, so the
          # bad artifact cannot be replaced afterwards.
          missing=""
          for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD \
                     ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!var}" ] || missing="${missing} ${var}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing required signing secrets:${missing}"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check version matches project.yml
        run: |
          # Guards against tagging vN while the app reports vM — the app's own
          # version is what users and Homebrew see.
          VERSION="${{ github.event.inputs.version }}"
          PROJECT_VERSION=$(awk '/MARKETING_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)
          if [ "${VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Requested version ${VERSION} does not match MARKETING_VERSION ${PROJECT_VERSION} in project.yml. Bump project.yml first."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MDViewer.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'platform=macOS'

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in the imported certificate"; exit 1; }

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project MDViewer.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "build/${APP_NAME}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            archive

      - name: Export Developer ID build
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath build/export

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

          # notarytool takes a zip; the ticket is stapled to the .app afterwards.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/${APP_NAME}.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc_key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "build/export/${APP_NAME}.app"

      - name: Verify artifact is shippable
        run: |
          # Hard gate. Everything below must hold before anything is published.
          APP="build/export/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "$APP"

          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Authority=Developer ID Application" /tmp/codesign.txt \
            || { echo "::error::Not signed with a Developer ID Application certificate"; exit 1; }
          grep -q "flags=.*runtime" /tmp/codesign.txt \
            || { echo "::error::Hardened runtime is not enabled"; exit 1; }

          spctl -a -vvv -t exec "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt \
            || { echo "::error::Gatekeeper does not see a notarized Developer ID build"; exit 1; }

          xcrun stapler validate "$APP"

      - name: Create zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${APP_NAME}-${VERSION}.zip"
          cd build/export
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "../../${ZIP_NAME}"
          cd ../..

          # The ticket must survive the round-trip, or downloaders are blocked.
          rm -rf build/verify && mkdir -p build/verify
          ditto -x -k "${ZIP_NAME}" build/verify
          spctl -a -vvv -t exec "build/verify/${APP_NAME}.app" 2>&1 | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Notarization did not survive zipping"; exit 1; }

          SHA256=$(shasum -a 256 "${ZIP_NAME}" | awk '{print $1}')
          SIZE=$(stat -f%z "${ZIP_NAME}")
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "**Artifact:** \`${ZIP_NAME}\`"
            echo "**Size:** ${SIZE} bytes"
            echo "**SHA256:** \`${SHA256}\`"
            echo ""
            echo "Update the Homebrew cask:"
            echo '```ruby'
            echo "version \"${VERSION}\""
            echo "sha256 \"${SHA256}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          SHA256="${{ steps.zip.outputs.sha256 }}"

          NOTES=$(cat <<EOF
          ## MDViewer ${VERSION}

          Native macOS markdown viewer — SwiftUI + MarkdownUI.

          ### Install via Homebrew

          \`\`\`bash
          brew tap ploutonconsulting/tap
          brew install --cask mdviewer
          \`\`\`

          ### Manual install

          1. Download \`${ZIP_NAME}\`
          2. Unzip → drag \`MDViewer.app\` to \`/Applications\`
          3. Launch normally — the app is signed with a Developer ID and notarized by Apple

          ### Artifact

          - SHA256: \`${SHA256}\`
          EOF
          )

          gh release create "v${VERSION}" \
            --title "MDViewer ${VERSION}" \
            --notes "${NOTES}" \
            "${ZIP_NAME}"

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
