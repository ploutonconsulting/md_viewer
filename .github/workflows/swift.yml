name: Build

on:
  push:
    branches: [ "development", "release" ]
  pull_request:
    branches: [ "development", "release" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project MDViewer.xcodeproj \
            -scheme MDViewer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify || xcodebuild \
              -project MDViewer.xcodeproj \
              -scheme MDViewer \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              build

      - name: Test
        run: |
          # Ad-hoc signing: the runner has no Developer ID or Mac Development
          # certificate, and the test bundle must still load into its host app.
          set -o pipefail
          xcodebuild test \
            -project MDViewer.xcodeproj \
            -scheme MDViewer \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO
